<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Сайт для понтов</title>
		<link href="CSS.css" rel="stylesheet" type="text/css"/>
		
		<script src="eel.js"></script>
		<link rel="icon" type="image/png" href="/favicon.png">
	</head>
	<body>
		<div> 
			<div class="choose_mode">
				<form action="#">
				
						<input type= "submit" id="instruments" value="Инструменты">
						<input type= "submit" id="light" value="Свет"> 
						<input type= "submit" id="fon" value= "Окружение">
						<input type= "submit" id="prosmotr" value= "Просмотр">
				
				</form>
			</div>
			<script>
				let choosed_mode_instruments = document.querySelector("#instruments");
				choosed_mode_instruments.addEventListener("click", choose_mode_in_web_instruments);
				
				async function choose_mode_in_web_instruments() {
					let choosed_mode= 0
					await eel.choose_mode(choosed_mode);
				}	
					
					
				let choosed_mode_light = document.querySelector("#light");
				choosed_mode_light.addEventListener("click", choose_mode_in_web_light);
				
				async function choose_mode_in_web_light() {
					let choosed_mode= 1
					await eel.choose_mode(choosed_mode);
				}	
					
					
				let choosed_mode_fon = document.querySelector("#fon");
				choosed_mode_fon.addEventListener("click", choose_mode_in_web_fon);
				
				async function choose_mode_in_web_fon() {
					let choosed_mode= 2
					await eel.choose_mode(choosed_mode);
				
				}
				
				
				let choosed_mode_prosmotr = document.querySelector("#prosmotr");
				choosed_mode_prosmotr.addEventListener("click", choose_mode_in_web_prosmotr);
				
				async function choose_mode_in_web_prosmotr() {
					let choosed_mode= 3
					await eel.choose_mode(choosed_mode);
				}	
			</script>
			<script>
				eel.expose(name_kist);
				function name_kist (x){
					console.log(x);				
					
				}
			</script>
			<div>
				<script> document.body.append(x); </script>
			</div>
		</div>
		
	</body>

</html>
